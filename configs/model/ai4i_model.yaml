# AI4I Model Configuration (Static)
model_type: "AI4IModel"
native_modalities:
  - "temperature"
  - "speed"
  - "torque"
  - "tool_wear"

modality_channels:
  temperature: 2  # air temperature and process temperature
  speed: 1
  torque: 1
  tool_wear: 1

embed_dim: 32
num_heads: 4
num_fault_classes: 6
enable_rul: false
dropout_p: 0.15
